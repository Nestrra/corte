openapi: 3.1.0
info:
  title: Corte API — Tarjetas
  version: 0.2.0
  description: >
    Spec 002. Todo bajo /api/v1 y con `Authorization: Bearer <accessToken>`. Solo se ven y
    modifican las tarjetas del usuario del token (principio III); una tarjeta de otro usuario, una
    inexistente y un id que no es UUID responden igual: 404 NOT_FOUND. Con la contraseña temporal
    pendiente, todas responden 403 PASSWORD_CHANGE_REQUIRED (spec 001). Montos: enteros en pesos
    COP. Fechas: strings YYYY-MM-DD. Errores: ver contracts/errors.md.
servers:
  - url: http://localhost:3000/api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CardColor:
      type: string
      enum: [negro, morado, amarillo, naranja, verde, marron]
    Amount:
      type: integer
      minimum: 1
      maximum: 9999999999
      description: Pesos COP, entero
    Day:
      type: integer
      minimum: 1
      maximum: 31
    ReminderDays:
      type: integer
      minimum: 0
      maximum: 15
    IsoDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: '2026-12-08'
    Card:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - color
        - last4
        - cutoffDay
        - dueDay
        - creditLimit
        - cycleBudget
        - availableCredit
        - remindCutoffDays
        - remindDueDays
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { $ref: '#/components/schemas/CardColor' }
        last4: { type: [string, 'null'], pattern: '^\d{4}$' }
        cutoffDay: { $ref: '#/components/schemas/Day' }
        dueDay: { $ref: '#/components/schemas/Day' }
        creditLimit: { $ref: '#/components/schemas/Amount' }
        cycleBudget: { $ref: '#/components/schemas/Amount' }
        availableCredit:
          type: integer
          description: En esta spec siempre igual a creditLimit (FR-017); la spec 003 lo calcula.
        remindCutoffDays: { $ref: '#/components/schemas/ReminderDays' }
        remindDueDays: { $ref: '#/components/schemas/ReminderDays' }
        archivedAt: { type: [string, 'null'], format: date-time, description: Nulo si está activa }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Cycle:
      type: object
      additionalProperties: false
      required: [today, nextCutoff, nextCutoffDue, nextDue]
      description: Calculado con packages/domain, el reloj del servidor y la zona del usuario.
      properties:
        today: { $ref: '#/components/schemas/IsoDate' }
        nextCutoff: { $ref: '#/components/schemas/IsoDate' }
        nextCutoffDue: { $ref: '#/components/schemas/IsoDate' }
        nextDue:
          $ref: '#/components/schemas/IsoDate'
          description: Primera fecha límite igual o posterior a today (puede ser del corte anterior).
    CardDetail:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          required: [cycle]
          properties:
            cycle: { $ref: '#/components/schemas/Cycle' }
    CreateCard:
      type: object
      additionalProperties: false
      required: [name, color, cutoffDay, dueDay, creditLimit, cycleBudget]
      properties:
        name: { type: string, description: Se recortan espacios; 1–40 caracteres }
        color: { $ref: '#/components/schemas/CardColor' }
        last4: { type: [string, 'null'], pattern: '^\d{4}$' }
        cutoffDay: { $ref: '#/components/schemas/Day' }
        dueDay: { $ref: '#/components/schemas/Day' }
        creditLimit: { $ref: '#/components/schemas/Amount' }
        cycleBudget:
          $ref: '#/components/schemas/Amount'
          description: No mayor que creditLimit (EXCEEDS_CREDIT_LIMIT)
        remindCutoffDays: { $ref: '#/components/schemas/ReminderDays', default: 2 }
        remindDueDays: { $ref: '#/components/schemas/ReminderDays', default: 3 }
    UpdateCard:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Cualquier subconjunto de CreateCard. El tope se valida contra el cupo resultante
        (enviado o guardado). last4 null borra los últimos 4 dígitos.
      properties:
        name: { type: string }
        color: { $ref: '#/components/schemas/CardColor' }
        last4: { type: [string, 'null'], pattern: '^\d{4}$' }
        cutoffDay: { $ref: '#/components/schemas/Day' }
        dueDay: { $ref: '#/components/schemas/Day' }
        creditLimit: { $ref: '#/components/schemas/Amount' }
        cycleBudget: { $ref: '#/components/schemas/Amount' }
        remindCutoffDays: { $ref: '#/components/schemas/ReminderDays' }
        remindDueDays: { $ref: '#/components/schemas/ReminderDays' }
    Error:
      type: object
      required: [statusCode, code, message]
      properties:
        statusCode: { type: integer }
        code: { type: string }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
  responses:
    ValidationError:
      description: VALIDATION_ERROR con errores por campo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: TOKEN_EXPIRED / SESSION_REVOKED (spec 001)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PasswordChangeRequired:
      description: PASSWORD_CHANGE_REQUIRED (spec 001)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: NOT_FOUND — inexistente, de otro usuario o id inválido (mismo cuerpo)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    CardId:
      name: id
      in: path
      required: true
      schema: { type: string }
paths:
  /cards:
    get:
      summary: Lista las tarjetas del usuario en orden de creación
      parameters:
        - name: archived
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
          description: true lista las archivadas; por defecto, las activas
      responses:
        '200':
          description: Tarjetas (sin ciclo)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
    post:
      summary: Crea una tarjeta activa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCard' }
      responses:
        '201':
          description: Tarjeta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
  /cards/{id}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      summary: Detalle de una tarjeta (activa o archivada) con su ciclo
      responses:
        '200':
          description: Tarjeta y ciclo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edita una tarjeta activa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCard' }
      responses:
        '200':
          description: Tarjeta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CARD_ARCHIVED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cards/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      summary: Archiva la tarjeta (idempotente)
      responses:
        '200':
          description: Tarjeta archivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cards/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      summary: Restaura una tarjeta archivada (idempotente)
      responses:
        '200':
          description: Tarjeta activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
