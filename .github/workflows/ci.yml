# CI for every pull request and every push to main (spec 000, FR-020/FR-021; research.md R10).
# On main, publish-images also pushes the API and migrate images to GHCR after every check passes.
# Job names are stable on purpose: they are the required status checks for merging into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corte/domain build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  domain-test:
    name: domain-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corte/domain test:cov

  api-e2e:
    name: api-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: corte
          POSTGRES_PASSWORD: corte # CI-only throwaway database, not a secret
          POSTGRES_DB: corte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corte -d corte_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://corte:corte@localhost:5432/corte_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corte/domain build
      - run: pnpm --filter api test
      - run: pnpm --filter api test:e2e

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: corte-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size (< 300 MB uncompressed)
        run: |
          # Sum of uncompressed layer sizes: same result with the classic and containerd image stores.
          size=$(docker history --human=false --format '{{.Size}}' corte-api:ci | awk '{s+=$1} END {print s}')
          limit=$((300 * 1000 * 1000))
          echo "Image size: $((size / 1000000)) MB (limit: 300 MB)"
          test "$size" -le "$limit"

  # Publishes the API and migrations images to GHCR, only for pushes to main that passed every
  # check. Tags: the full commit SHA (immutable, for deploys) and "main" (moves with the branch).
  publish-images:
    name: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-typecheck, domain-test, api-e2e, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/nestrra/corte-api:${{ github.sha }}
            ghcr.io/nestrra/corte-api:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: |
            ghcr.io/nestrra/corte-migrate:${{ github.sha }}
            ghcr.io/nestrra/corte-migrate:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
